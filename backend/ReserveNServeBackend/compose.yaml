services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: reservenserve-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1436:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: reservenserve-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  mailpit:
    image: axllent/mailpit:latest
    container_name: reservenserve-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  identity-api:
    build:
      context: .
      dockerfile: Services/Identity/Identity.API/Dockerfile
    container_name: reservenserve-identity
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__IdentityDb: "Server=sqlserver,1433;Database=ReserveNServe.Identity;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"

      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest

    ports:
      - "5206:8080"

    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notifications-api:
    build:
      context: .
      dockerfile: Services/Notifications/Notifications.API/Dockerfile
    container_name: reservenserve-notifications
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__NotificationsDb: "Server=sqlserver,1433;Database=ReserveNServe.Notifications;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"

      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest

      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__UseSsl: "false"
      Smtp__User: ""
      Smtp__Password: ""
      Smtp__FromName: "ReserveNServe"
      Smtp__FromAddress: "no-reply@reservenserve.local"

      FrontendBaseUrl: "http://localhost:3000"

    ports:
      - "5200:8080"

    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
  
  restaurants-api:
    build:
      context: ./Services/Restaurants/Restaurants.API
      dockerfile: Dockerfile

    container_name: reservenserve-restaurants

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_Kestrel__Endpoints__Http__Url: "http://+:8080"
      ASPNETCORE_Kestrel__Endpoints__Http__Protocols: "Http1"

      ASPNETCORE_Kestrel__Endpoints__Https__Url: "https://+:8081"
      ASPNETCORE_Kestrel__Endpoints__Https__Protocols: "Http1AndHttp2"

      ASPNETCORE_Kestrel__Endpoints__Grpc__Url: "http://+:8082"
      ASPNETCORE_Kestrel__Endpoints__Grpc__Protocols: "Http2"

      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/reservenserve.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${ASPNETCORE_HTTPS_CERTIFICATE_PASSWORD}

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${RESTAURANTS_DB_NAME:-Restaurant};User Id=${RESTAURANTS_DB_USER:-restaurants_app};Password=${RESTAURANTS_DB_PASSWORD};TrustServerCertificate=True"

    ports:
    - "${RESTAURANTS_HTTP_PORT:-5174}:8080"
    - "${RESTAURANTS_HTTPS_PORT:-7274}:8081"

    expose:
      - "8082"

    volumes:
      - "${ASPNET_HTTPS_PATH}:/https:ro"

    depends_on:
      restaurants-db-init:
        condition: service_completed_successfully

  restaurants-db-init:
    build:
      context: ./Services/Restaurants/Restaurants.API/Database
      dockerfile: Dockerfile
    container_name: reservenserve-restaurants-db-init

    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      RESTAURANTS_DB_NAME: ${RESTAURANTS_DB_NAME:-Restaurant}
      RESTAURANTS_DB_USER: ${RESTAURANTS_DB_USER:-restaurants_app}
      RESTAURANTS_DB_PASSWORD: ${RESTAURANTS_DB_PASSWORD:?RESTAURANTS_DB_PASSWORD is required}

    depends_on:
      sqlserver:
        condition: service_healthy

    entrypoint: ["/bin/bash", "-c"]

    command:
      - |
        set -euo pipefail
        
        DB_EXISTS=$$(/opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver \
          -U sa \
          -P "$$MSSQL_SA_PASSWORD" \
          -C \
          -h -1 \
          -W \
          -Q "SET NOCOUNT ON; SELECT CASE WHEN DB_ID('$${RESTAURANTS_DB_NAME}') IS NULL THEN 0 ELSE 1 END;" \
          | tr -d '[:space:]')

        if [ "$$DB_EXISTS" = "0" ]; then
          echo "Database '$$RESTAURANTS_DB_NAME' does not exist. Initializing..."

          /opt/mssql-tools18/bin/sqlcmd \
            -S sqlserver \
            -U sa \
            -P "$$MSSQL_SA_PASSWORD" \
            -C \
            -i /scripts/init.sql \
            -v \
              DB_NAME="$$RESTAURANTS_DB_NAME" \
              DB_USER="$$RESTAURANTS_DB_USER" \
              DB_PASSWORD="$$RESTAURANTS_DB_PASSWORD"

          echo "Restaurant database initialized successfully."
        else
          echo "Database '$$RESTAURANTS_DB_NAME' already exists. Skipping initialization."
        fi

    restart: "no"

    
  payment-api:
    build:
      context: ./Services/Payment/Payment.API
      dockerfile: Dockerfile

    container_name: reservenserve-payment

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_Kestrel__Endpoints__Http__Url: "http://+:8080"
      ASPNETCORE_Kestrel__Endpoints__Http__Protocols: "Http1"
      ASPNETCORE_Kestrel__Endpoints__Https__Url: "https://+:8081"
      ASPNETCORE_Kestrel__Endpoints__Https__Protocols: "Http1AndHttp2"
      ASPNETCORE_Kestrel__Endpoints__Grpc__Url: "http://+:8082"
      ASPNETCORE_Kestrel__Endpoints__Grpc__Protocols: "Http2"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/reservenserve.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${ASPNETCORE_HTTPS_CERTIFICATE_PASSWORD}

      PAYMENT_STRIPE_SECRET_KEY: ${PAYMENT_STRIPE_SECRET_KEY}
      PAYMENT_STRIPE_WEBHOOK_SECRET: ${PAYMENT_STRIPE_WEBHOOK_SECRET}

      RabbitMq__Host: ${PAYMENT_RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Username: ${PAYMENT_RABBITMQ_USERNAME:-guest}
      RabbitMq__Password: ${PAYMENT_RABBITMQ_PASSWORD}

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${PAYMENT_DB_NAME:-Payment};User Id=${PAYMENT_DB_USER:-payment_app};Password=${PAYMENT_DB_PASSWORD};TrustServerCertificate=True"

    ports:
      - "${PAYMENT_HTTP_PORT:-5175}:8080"
      - "${PAYMENT_HTTPS_PORT:-7275}:8081"

    expose:
      - "8082"

    volumes:
      - "${ASPNET_HTTPS_PATH}:/https:ro"

    depends_on:
      payment-db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  payment-db-init:
    build:
      context: ./Services/Payment/Payment.API/Database
      dockerfile: Dockerfile

    container_name: reservenserve-payment-db-init

    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-Restaurant}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:-payment_app}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD is required}

    depends_on:
      sqlserver:
        condition: service_healthy

    entrypoint: ["/bin/bash", "-c"]

    command:
      - |
        set -euo pipefail

        DB_EXISTS=$$(/opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver \
          -U sa \
          -P "$$MSSQL_SA_PASSWORD" \
          -C \
          -h -1 \
          -W \
          -Q "SET NOCOUNT ON; SELECT CASE WHEN DB_ID('$${PAYMENT_DB_NAME}') IS NULL THEN 0 ELSE 1 END;" \
          | tr -d '[:space:]')

        if [ "$$DB_EXISTS" = "0" ]; then
          echo "Database '$$PAYMENT_DB_NAME' does not exist. Initializing..."

          /opt/mssql-tools18/bin/sqlcmd \
            -S sqlserver \
            -U sa \
            -P "$$MSSQL_SA_PASSWORD" \
            -C \
            -i /scripts/init.sql \
            -v \
              DB_NAME="$$PAYMENT_DB_NAME" \
              DB_USER="$$PAYMENT_DB_USER" \
              DB_PASSWORD="$$PAYMENT_DB_PASSWORD"

          echo "Restaurant database initialized successfully."
        else
          echo "Database '$$PAYMENT_DB_NAME' already exists. Skipping initialization."
        fi

    restart: "no"

  stripe-listener:
    image: stripe/stripe-cli:latest
    container_name: reservenserve-stripe-listener
    restart: unless-stopped
    depends_on:
      payment-api:
        condition: service_started
    command:
      - listen
      - --api-key
      - ${PAYMENT_STRIPE_SECRET_KEY}
      - --events
      - payment_intent.succeeded,payment_intent.payment_failed,refund.created,refund.updated,refund.failed
      - --forward-to
      - http://payment-api:8080/api/PaymentWebhook/StripeWebhook

  reservations-db:
    image: postgres:${POSTGRES_VERSION:-17}
    container_name: reservenserve-reservations-db

    environment:
      POSTGRES_DB: ${DB_NAME:-ReservationsDb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

    volumes:
      - reservations_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ReservationsDb}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  reservations-api:
    build:
      context: .
      dockerfile: Services/Reservations/Reservations.API/Dockerfile

    container_name: reservenserve-reservations

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: "http://+:8080;https://+:8081"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/reservenserve.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${ASPNETCORE_HTTPS_CERTIFICATE_PASSWORD}

      DB_HOST: reservations-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ReservationsDb}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}

      GrpcServices__Restaurants: "http://restaurants-api:8082"
      GrpcServices__Payment: "http://payment-api:8082"

      RabbitMq__Host: ${RESERVATIONS_RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Username: ${RESERVATIONS_RABBITMQ_USERNAME:-guest}
      RabbitMq__Password: ${RESERVATIONS_RABBITMQ_PASSWORD}

      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Key: ${JWT_KEY}

    ports:
      - "${RESERVATIONS_HTTP_PORT:-5040}:8080"
      - "${RESERVATIONS_HTTPS_PORT:-7294}:8081"

    volumes:
      - ${HOME}/.aspnet/https:/https:ro

    depends_on:
      reservations-db:
        condition: service_healthy
      restaurants-api:
        condition: service_started
      payment-api:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_RESERVATIONS_API_URL: ${NEXT_PUBLIC_RESERVATIONS_API_URL:-https://localhost:7294}
        NEXT_PUBLIC_RESTAURANTS_API_URL: ${NEXT_PUBLIC_RESTAURANTS_API_URL:-http://localhost:5174}

    container_name: reservenserve-frontend

    environment:
      NODE_ENV: production

    ports:
      - "${FRONTEND_PORT:-3000}:3000"


volumes:
  sqlserver_data:
  rabbitmq_data:
  reservations_data:
