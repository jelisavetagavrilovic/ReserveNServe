services:
  mailhog:
    image: mailhog/mailhog
    container_name: rns-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  notifications-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rns-notifications-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Your_strong_Password123!"
    ports:
      - "1436:1433"
    volumes:
      - notifications_sql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Your_strong_Password123!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rns-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  notifications_sql_data:
